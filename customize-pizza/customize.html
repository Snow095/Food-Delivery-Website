<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customise Pizza</title>
    <link rel="stylesheet" href="./customize.css">
</head>
<body>
    <section class="bg"></section>
    <section class="customize">
        <div class="cuspizza">
            <h3>Special Offers <img src="../images/Back.png" alt=""> Meal Deal 1<img src="../images/Back.png" alt=""> Customise Pizza 1</h3>
            <div class="sele-cuspizza">
                <p style="font-size: 32px; margin-left: 25px; line-height: 40px;">Customise your chicken Pizza</p>
                <h4 style="font-size: 24px; color: #03081F; padding-right: 40px;">4/4 Selected</h4>
            </div>
        </div>
        <div class="sel-op">
            <img src="../images/Polo.png" alt="">
            <div class="pizzamenText">
                <h4 style="font-size: 44px; line-height: 58px; margin-left: 15px; color: #FC8A06; text-align: center;">Please select up to 4 options free!</h4>
            </div>
        </div>
        <div class="check-boxPiz">
            <div class="veg-top">
                <div class="carrot"><img src="../images/Carrot.png" alt="Vegetables"></div>
                <h3>Vegetable Toppings</h3>
            </div>
            <form class="checkbox">
                <div class="check1">
                    <input type="checkbox" name="veggies" id="cheese" value="cheese" checked>
                    <label for="cheese">Cheese</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="veggies" id="mushrooms" value="mushrooms">
                    <label for="mushrooms">Mushrooms</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="veggies" id="pineapples" value="pineapples">
                    <label for="pineapples">Pineapples</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="veggies" id="tomato" value="tomato">
                    <label for="tomato">Tomato</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="veggies" id="jalapeneos" value="jalapeneos">
                    <label for="jalapeneos">Jalapeneos</label>
                </div>
            </form>
        </div>

        <div class="check-boxPiz2">
            <div class="veg-top">
                <div class="carrot"><img src="../images/Meat.png" alt="Meat"></div>
                <h3>Meat Toppings</h3>
            </div>
            <form class="checkbox">
                <div class="check1">
                    <input type="checkbox" name="meats" id="chicken" value="chicken">
                    <label for="chicken">Chicken</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="meats" id="pepperoni" value="pepperoni">
                    <label for="pepperoni">Pepperoni</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="meats" id="beef" value="beef">
                    <label for="beef">Beef</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="meats" id="salami" value="salami">
                    <label for="salami">Salami</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="meats" id="fish" value="fish">
                    <label for="fish">Fish</label>
                </div>
            </form>
        </div>

        <div class="check-boxPiz3">
            <div class="veg-top">
                <div class="carrot"><img src="../images/Whole Fish.png" alt="Seafood"></div>
                <h3>Seafood Toppings</h3>
            </div>
            <form class="checkbox">
                <div class="check1">
                    <input type="checkbox" name="seafood" id="tuna" value="tuna" checked>
                    <label for="tuna">Tuna</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="seafood" id="anchovies" value="anchovies">
                    <label for="anchovies">Anchovies</label>
                </div>
                <div class="check1">
                    <input type="checkbox" name="seafood" id="prawns" value="prawns">
                    <label for="prawns">Prawns</label>
                </div>
            </form>
        </div>
        <div class="tot-del">
            <div class="total-pay"><h4>Total to pay</h4><p>£127.90</p></div>
            <p style="font-size: 17px;line-height: 25px; align-items: center;">Delivery & Tax will be calculated in the next step</p>
        </div>
        <div class="take-back">
            <a href="../mealdeal/mealdeal.html"><h4 style="text-decoration: solid black underline; font-size: 24px; color: black;">Take me back</h4></a>
            <div class="next">
                <img src="../images/Forward Button (1).png" alt="">
                <a href="../add-request/add-request.html"><p style="text-decoration: solid white underline; color: white;">Next Step</p></a>
            </div>
        </div>
    </section>
</body>
</html>
